name: P21 Windows native candidate from exact P20 cache
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact P21 native overlay
        required: true
        type: choice
        options: [P21]
        default: P21
permissions:
  contents: read
concurrency:
  group: p20-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ !github.event.repository.private && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/p20-hosted-ci-r570' && inputs.candidate == 'P21' }}
    runs-on: windows-2022
    # Existing Cargo 120m, sandbox test compile 30m and assembly 30m.
    # P21 adds a separate Git libtest compile with its own 30m bound.
    timeout-minutes: 230
    env:
      CI_P20_ROOT: C:\cagp20-${{ github.run_id }}-${{ github.run_attempt }}
      CI_REPOSITORY_VISIBILITY: public
      CI_P20_BUILD_JOBS: '2'
      OTEL_SDK_DISABLED: 'true'
      VSCMD_SKIP_SENDTELEMETRY: '1'
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Reclaim only disposable hosted-runner tools
        shell: pwsh
        run: ./scripts/ci/p20-hosted-tools.ps1 -Mode Space
      - name: Python for build control only
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Check CI safety and real Git byte roundtrip
        shell: pwsh
        run: |
          python -I -B -m unittest discover -s scripts/ci -p test_p20_ci.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -B -m unittest discover -s scripts/ci -p test_p21_ci.py -v
      - name: Install pinned controller dependency
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r scripts/ci/requirements-windows.txt
      - name: Select exact Rust and native MSVC SDK environment
        shell: pwsh
        run: ./scripts/ci/p20-hosted-tools.ps1 -Mode Toolchain
      - name: Restore native dependency and target build cache
        id: p20-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            C:/cagp20-native-cache-v1/cargo/registry
            C:/cagp20-native-cache-v1/cargo/git
            C:/cagp20-native-cache-v1/target
          key: p20-native-v1-Windows-rust1.99.1-msvc14.44.35207-sdk10.0.26100.0-2259036772c5d8d77d636305ab4f7f12795632b3dfa469d0df5e4a2ade51bbd7-42337939507-1
      - name: Verify public inputs and normal P21 plan
        shell: pwsh
        run: python -I -B -u scripts/ci/p20-windows.py prepare --candidate P21 --root "$env:CI_P20_ROOT"
      - name: Normal single Cargo invocation for all six native targets
        shell: pwsh
        env:
          CI_P20_CACHE_HIT: ${{ steps.p20-cache.outputs.cache-hit }}
          CI_P20_CACHE_KEY: p20-native-v1-Windows-rust1.99.1-msvc14.44.35207-sdk10.0.26100.0-2259036772c5d8d77d636305ab4f7f12795632b3dfa469d0df5e4a2ade51bbd7-42337939507-1
        run: python -I -B -u scripts/ci/p20-windows.py build --candidate P21 --root "$env:CI_P20_ROOT"
      - name: Compile and run the exact eighteen component tests
        shell: pwsh
        run: python -I -B -u scripts/ci/p20-windows.py unit --candidate P21 --root "$env:CI_P20_ROOT"
      - name: Compile and run the exact twelve plugin Git tests
        shell: pwsh
        run: python -I -B -u scripts/ci/p20-windows.py git_unit --candidate P21 --root "$env:CI_P20_ROOT"
      - name: Normal clean-source native assembly
        shell: pwsh
        run: python -I -B -u scripts/ci/p20-windows.py package --candidate P21 --root "$env:CI_P20_ROOT"
      - name: Save build intermediates even after producer failure
        if: ${{ always() && !cancelled() && steps.p20-cache.outputs.cache-hit == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            C:/cagp20-native-cache-v1/cargo/registry
            C:/cagp20-native-cache-v1/cargo/git
            C:/cagp20-native-cache-v1/target
          key: p21-native-v1-${{ runner.os }}-${{ hashFiles('native/build-lock.O165-P21-source.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload scoped candidate and original evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: p21-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CI_P20_ROOT }}/delivery/**
            ${{ env.CI_P20_ROOT }}/evidence/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
