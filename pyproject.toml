[build-system]
requires = ["setuptools==84.2.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-app-deepseek-gateway"
version = "0.1.0"
description = "A protocol gateway for the official Codex desktop application and DeepSeek"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.11"
dependencies = ["codex-deepseek-runtime @ https://codeload.github.com/0xZoharHuang/codex-deepseek-runtime/tar.gz/4d99981baaa493b0c4e7b1febbdb167e6c44de91#sha256=34d9261c03e1c31156506ec963cc8c07227e08d50486b25efbea1acbcbb59c03", "aiohttp==3.13.2", "tomlkit==0.15.2", "truststore==0.10.5", "psutil==7.2.2", "beautifulsoup4==4.15.0", "pypdfium2==5.14.0", "Pillow==13.0.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "mcp==2.3.0", "PyYAML==6.0.3"]
windows-qa = ["pywinauto==0.6.9; sys_platform == 'win32'", "pywin32==312; sys_platform == 'win32'", "comtypes==1.4.17; sys_platform == 'win32'"]

[project.scripts]
codex-app-deepseek = "codex_app_deepseek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-data]
codex_app_deepseek = ["assets/*.json", "assets/*.ps1"]
